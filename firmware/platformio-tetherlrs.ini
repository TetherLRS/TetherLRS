; generated by tools/tetherlrs_tx_envs.py from the [env:rx-*] sections of platformio.ini, do not edit
; every ESP receiver also as the ground radio: its own hal, TLRS_RX_AS_TX in Common/hal/device_conf.h

[env:tx-generic-900]
extends = env:rx-generic-900
build_src_filter =
  ${env_common_tx_esp82xx.build_src_filter}
  +<modules/sx12xx-lib/src/sx127x.cpp>
build_flags =
  ${env_common_rx_esp82xx.build_flags}
  -D RX_ELRS_GENERIC_900_ESP8285
  -D TLRS_RX_AS_TX

