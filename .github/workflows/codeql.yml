# CodeQL on the tool's TypeScript and JavaScript: on every push and pull request to dev and main, and once a week.
# The firmware's C++ would need a build inside CodeQL (PlatformIO and the Arm toolchain), so it is not scanned here.
name: CodeQL

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config: |
            paths:
              - tool
            paths-ignore:
              - tool/node_modules
              - tool/build
              - tool/src-tauri/target
      - uses: github/codeql-action/analyze@v3
        with:
          category: tool
