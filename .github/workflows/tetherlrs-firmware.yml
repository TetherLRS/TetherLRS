# TetherLRS: builds every PlatformIO environment; on a v* tag publishes them as a GitHub Release, with
# manifest.json for the tool (env, chip, offsets, sizes, sha256). Per env: <env>.bin for the ELRS web page or an
# update over TetherLRS, <env>-full.bin for the ESP ROM bootloader at 0x0.
name: TetherLRS firmware

on:
  push:
    branches: ['tetherlrs/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  envs:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "list=$(grep -oP '^\[env:\K[^\]]+' platformio.ini | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  build:
    needs: envs
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.envs.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - name: Submodules the ESP builds use
        run: git submodule update --init --recursive --depth 1 mLRS/modules/mavlink mLRS/modules/fastmavlink mLRS/modules/sx12xx-lib mLRS/modules/stm32ll-lib
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio==6.1.19 esptool==4.8.1
      - name: MAVLink library
        working-directory: mLRS/Common/mavlink
        run: python fmav_generate_c_library.py
      - run: pio run -e ${{ matrix.env }}
      - name: Package
        run: python tools/tetherlrs_package.py ${{ matrix.env }} out ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.env }}
          path: out/${{ matrix.env }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          path: fw
      - name: Release files and manifest
        run: |
          mkdir rel
          for d in fw/fw-*; do
            e=${d#fw/fw-}
            cp "$d/firmware.bin" "rel/$e.bin"
            cp "$d/full.bin" "rel/$e-full.bin"
          done
          jq -s 'map({(.env): .}) | add' fw/fw-*/info.json > rel/manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: rel/*
          generate_release_notes: true
