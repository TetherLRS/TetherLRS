# TetherLRS: builds every PlatformIO environment; on a v* tag publishes them as a GitHub Release with
# manifest.json for the tool (env, chip, offsets, sizes, sha256), and the web app with the firmware on GitHub
# Pages. Per env: <env>.bin for the ELRS web page or an update over TetherLRS, <env>-full.bin for the ESP ROM
# bootloader at 0x0.
name: TetherLRS firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  envs:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: firmware
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - name: Receivers as Tx up to date
        run: python3 tools/tetherlrs_tx_envs.py --check
      - id: list
        run: echo "list=$(grep -ohP '^\[env:\K[^\]]+' platformio.ini platformio-tetherlrs.ini | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  build:
    needs: envs
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: firmware
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.envs.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - name: Submodules the ESP builds use
        run: git submodule update --init --recursive --depth 1 mLRS/modules/mavlink mLRS/modules/fastmavlink mLRS/modules/sx12xx-lib mLRS/modules/stm32ll-lib
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', 'firmware/platformio-tetherlrs.ini') }}
      - run: pip install platformio==6.1.19 esptool==4.8.1
      - name: MAVLink library
        working-directory: firmware/mLRS/Common/mavlink
        run: python fmav_generate_c_library.py
      - run: pio run -e ${{ matrix.env }}
      - name: Package
        run: python tools/tetherlrs_package.py ${{ matrix.env }} out ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.env }}
          path: firmware/out/${{ matrix.env }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          path: fw
      - name: Release files and manifest
        run: |
          mkdir rel
          for d in fw/fw-*; do
            e=${d#fw/fw-}
            cp "$d/firmware.bin" "rel/$e.bin"
            cp "$d/full.bin" "rel/$e-full.bin"
          done
          jq -s 'map({(.env): .}) | add' fw/fw-*/info.json > rel/manifest.json
      - uses: softprops/action-gh-release@v2
        with:
          files: rel/*
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: rel

  # the web app, with this release's firmware next to it (the browser cannot read release assets: CORS)
  pages:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Web app
        working-directory: tool
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run build
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: rel
      - name: Firmware next to the web app
        run: |
          mkdir -p "tool/build/firmware/${{ github.ref_name }}" tool/build/firmware/latest
          cp rel/* "tool/build/firmware/${{ github.ref_name }}/"
          cp rel/* tool/build/firmware/latest/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tool/build
      - id: deploy
        uses: actions/deploy-pages@v4

  # the desktop app for Windows, macOS and Linux, attached to the same release
  desktop:
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries for the webview and the serial ports
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev
      - working-directory: tool
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tool
          tagName: ${{ github.ref_name }}
