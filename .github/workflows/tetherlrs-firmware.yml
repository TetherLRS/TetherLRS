# TetherLRS: runs the host tests and the tool's tests, builds every PlatformIO (ESP) environment and every STM32
# target; on a v* tag publishes them as a GitHub Release with manifest.json for the tool (env, chip, offsets, sizes,
# sha256), and the web app with the firmware on GitHub Pages. Per ESP env: <env>.bin for the ELRS web page or an
# update over TetherLRS, <env>-full.bin for the ESP ROM bootloader at 0x0. Per STM32 target: a .hex, or an .elrs for R9
# boards with the ExpressLRS bootloader. An -RC tag is a normal release, so the repository page shows it.
name: TetherLRS firmware

on:
  push:
    branches: [main, dev] # dev: the updates under test, built and checked like main, no release
    tags: ['v*'] # a tag always runs: GitHub does not apply the paths filter to tags
    paths-ignore: ['**.md', '.github/ISSUE_TEMPLATE/**'] # documentation alone builds nothing
  pull_request:
    paths-ignore: ['**.md', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Firmware host tests
        run: firmware/test/run_tests.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tool tests and types
        working-directory: tool
        run: |
          npm ci
          npx vitest run
          npx svelte-check --threshold error

  # mLRS's own build script with Arm's toolchain, the ST drivers and the DroneCAN library it generates
  stm32:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - name: Submodules the STM32 builds use
        run: |
          git submodule update --init --depth 1 mLRS/modules/mavlink mLRS/modules/fastmavlink mLRS/modules/stm32ll-lib \
            mLRS/modules/sx12xx-lib mLRS/modules/dronecan/DSDL mLRS/modules/dronecan/dronecan_dsdlc
          git submodule update --init --depth 1 $(git config -f ../.gitmodules --get-regexp 'path' | awk '{print $2}' | grep '^firmware/tools/st-drivers/' | sed 's#^firmware/##')
      - uses: actions/cache@v4
        id: arm
        with:
          path: ~/arm-gnu-toolchain
          key: arm-gnu-toolchain-13.2.rel1
      - name: Arm GNU toolchain 13.2.rel1
        if: steps.arm.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/arm-gnu-toolchain
          curl -sSL https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz \
            | tar -xJ -C ~/arm-gnu-toolchain --strip-components=1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install empy==3.3.4 pexpect dronecan
      - name: ST drivers, MAVLink and DroneCAN libraries
        run: |
          (cd tools && python run_copy_st_drivers.py -silent)
          (cd mLRS/Common/mavlink && python fmav_generate_c_library.py)
          (cd mLRS/Common/dronecan && python dronecan_generate_c_library.py -np)
      - name: Build
        run: |
          set -o pipefail
          export PATH=~/arm-gnu-toolchain/bin:$PATH
          python tools/run_make_firmwares.py --nopause --version ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }} | tee stm32.log
          ! grep -E "error:|Traceback" stm32.log
          # every target of run_make_firmwares.py: 49 .hex, and 4 .elrs for the R9 boards with the ExpressLRS bootloader
          test "$(ls tools/build/firmware/*.hex | wc -l)" -eq 49 && test "$(ls tools/build/firmware/*.elrs | wc -l)" -eq 4
      - uses: actions/upload-artifact@v4
        with:
          name: fw-stm32
          if-no-files-found: error
          path: |
            firmware/tools/build/firmware/*.hex
            firmware/tools/build/firmware/*.elrs

  envs:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: firmware
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
      - name: ExpressLRS targets
        run: git submodule update --init --depth 1 elrs-targets
      - name: Generated files up to date
        run: |
          python3 tools/tetherlrs_gen_elrs.py --check
          python3 tools/tetherlrs_tx_envs.py --check
          python3 tools/tetherlrs_elrs_products.py --check
      # every env, in groups of 8: one setup of PlatformIO and its toolchains serves a group
      - id: list
        run: |
          echo "groups=$(grep -ohP '^\[env:\K[^\]]+' platformio.ini platformio-tetherlrs-elrs.ini platformio-tetherlrs.ini \
            | jq -R . | jq -cs '[_nwise(8) | join(" ")]')" >> "$GITHUB_OUTPUT"

  build:
    needs: envs
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: firmware
    strategy:
      fail-fast: false
      matrix:
        envs: ${{ fromJSON(needs.envs.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - name: Submodules the ESP builds use
        run: git submodule update --init --recursive --depth 1 mLRS/modules/mavlink mLRS/modules/fastmavlink mLRS/modules/sx12xx-lib mLRS/modules/stm32ll-lib
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio==6.1.19 esptool==4.8.1
      - name: MAVLink library
        working-directory: firmware/mLRS/Common/mavlink
        run: python fmav_generate_c_library.py
      - name: Build and package
        run: |
          for e in ${{ matrix.envs }}; do
            pio run -e "$e"
            python tools/tetherlrs_package.py "$e" out ${{ github.ref_name }}
          done
      - id: name
        run: echo "name=fw-$(echo '${{ matrix.envs }}' | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: firmware/out

  release:
    needs: [tests, build, stm32]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          path: fw
      - name: Release files and manifest
        run: |
          mkdir rel
          for d in fw/fw-*/*/; do
            e=$(basename "$d")
            cp "$d/firmware.bin" "rel/$e.bin"
            cp "$d/full.bin" "rel/$e-full.bin"
          done
          cp fw/fw-stm32/*.hex fw/fw-stm32/*.elrs rel/
          jq -s 'map({(.env): .}) | add' fw/fw-*/*/info.json > rel/manifest.json
      # one upload a second and nothing twice: 500 assets at full speed trip GitHub's secondary rate limit, which
      # left v1.0 a draft without its last jobs
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ github.ref_name }}
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --generate-notes --title "$tag"
          have=$(gh release view "$tag" --json assets --jq '.assets[].name')
          for f in rel/*; do
            grep -qx "$(basename "$f")" <<<"$have" && continue
            gh release upload "$tag" "$f"
            sleep 1
          done
          gh release edit "$tag" --draft=false --latest
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: rel

  # the web app, with this release's firmware next to it (the browser cannot read release assets: CORS)
  pages:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Web app
        working-directory: tool
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run build
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: rel
      - name: Firmware next to the web app
        run: |
          mkdir -p "tool/build/firmware/${{ github.ref_name }}" tool/build/firmware/latest
          cp rel/* "tool/build/firmware/${{ github.ref_name }}/"
          cp rel/* tool/build/firmware/latest/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tool/build
      - id: deploy
        uses: actions/deploy-pages@v4

  # the desktop app for Windows, macOS and Linux, attached to the same release
  desktop:
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries for the webview and the serial ports
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev
      - working-directory: tool
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tool
          tagName: ${{ github.ref_name }}
